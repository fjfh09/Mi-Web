# =========================================================================
# 1. SERVIDOR PRINCIPAL: fjfh.almagara.es
# =========================================================================


# Redirección HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fjfh.almagara.es;
    
    # Desafío HTTP-01 de Certbot para renovación tradicional
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fjfh.almagara.es;

    root /var/www/html;
    index index.html index.php;

    access_log /var/log/nginx/fjfh.almagara.es-access.log;
    error_log  /var/log/nginx/fjfh.almagara.es-error.log error;

    client_max_body_size 100m;
    client_body_timeout 120s;
    sendfile off;

    # Certificados SSL Wildcard para almagara.es (Mapeados desde el Host)
    ssl_certificate /etc/letsencrypt/live/almagara.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/almagara.es/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Protocolos y Cifrados Seguros (Cumpliendo estándares modernos de seguridad)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers on;

    # Cabeceras de Seguridad Avanzadas
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; default-src 'self' https: wss: ws: data: blob: 'unsafe-inline' 'unsafe-eval';" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Redirección de la VPN al subdominio vpn.almagara.es
    location ~ ^/vpn(?:/(.*))?$ {
        return 301 https://vpn.almagara.es/$1;
    }

    # Rutas estáticas generales
    location / {
        try_files $uri $uri/ /index.html?$query_string;
    }

    # Caché de archivos estáticos (Lighthouse Performance)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2?|ttf|eot|webp|pdf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Procesamiento de PHP mediante fastcgi en el contenedor web-fpm
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass web-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "upload_max_filesize = 100M \n post_max_size=100M";
        fastcgi_param HTTP_PROXY "";
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    # Bloquear acceso a archivos ocultos (como .git, .env) para evitar fugas de información
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

